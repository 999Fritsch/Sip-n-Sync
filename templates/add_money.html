<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geld hinzufügen - Sip-n-Sync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Geld hinzufügen</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('add_money') }}">
            <div class="form-group">
                <label for="amount">Betrag (€):</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0" required>
            </div>
            <button type="submit" class="btn">Geld hinzufügen</button>
        </form>
        
        <div class="navigation">
            <a href="{{ url_for('index') }}" class="btn">Zurück zur Bestellung</a>
            <a href="{{ url_for('logout') }}" class="btn">Abmelden</a>
        </div>
    </div>
</body>
</html>
