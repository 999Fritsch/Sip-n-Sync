<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sip-n-Sync{% endblock %}</title>
    <style>
        /* Add your common CSS here */
        .navigation {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            margin: 5px;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
        }
        .user-info {
            background-color: #f8f9fa;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    {% block additional_styles %}{% endblock %}
</head>
<body>
    {% include 'header.html' %}
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% include 'navigation.html' %}
</body>
</html>
